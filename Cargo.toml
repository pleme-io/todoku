[package]
name = "todoku"
version = "0.1.2"
edition = "2024"
rust-version = "1.89.0"
description = "Todoku (届く) — HTTP client framework for pleme-io apps"
homepage = "https://github.com/pleme-io/todoku"
repository = "https://github.com/pleme-io/todoku"
documentation = "https://docs.rs/todoku"
readme = "README.md"
license = "MIT"
categories = ["web-programming::http-client"]
keywords = ["http", "client", "api", "retry", "authentication"]

[features]
default = []
# Browser TLS-fingerprint (JA3/JA4) emulation via wreq/BoringSSL. Off by
# default so the standard build stays pure reqwest+rustls (no C/Go toolchain).
# This is the pleme-io absorption of Obscura's `--features stealth` wreq swap;
# select a browser fingerprint with `HttpClientBuilder::tls_profile`.
stealth = ["dep:wreq", "dep:wreq-util"]

[lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dependencies]
# handan owns what an HTTP status MEANS and what Retry-After says, shared
# fleet-wide so this is never re-derived. Zero dependencies.
handan = "0.1"
async-trait = "0.1"
# ★ `default-features = false` is load-bearing, not tidiness.
#
# Cargo features are ADDITIVE. Asking for `rustls-tls` does not turn off
# reqwest's default `default-tls`, so the graph carried BOTH stacks —
# `hyper-rustls` AND `hyper-tls` — and native-tls dragged in `openssl-sys`.
# That contradicted the comment fifteen lines up ("the standard build stays
# pure reqwest+rustls, no C/Go toolchain"), which described the intent
# correctly and was false in the lockfile.
#
# It also broke a consumer's CI: mado depends on todoku transitively
# (mado → nami-core → todoku), and `openssl-sys` cannot build in a nix
# devShell that provides no openssl — measured 2026-08-01,
# "openssl/opensslconf.h: No such file or directory".
#
# The re-listed features are reqwest 0.12's own defaults MINUS `default-tls`
# (`charset`, `http2`, `macos-system-configuration`), so nothing else
# changes shape.
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "json",
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2.0"
tokio = { version = "1", features = ["time", "net", "rt"] }
# URL parsing for the SSRF guard (typed scheme/host inspection). Already pulled
# in transitively by reqwest; declared explicitly so ssrf.rs owns it.
url = "2"
# Stealth-only: browser TLS fingerprint emulation. Pulls BoringSSL — gated
# behind the `stealth` feature so the default build never compiles it.
wreq = { version = "5.3", optional = true, features = ["json"] }
wreq-util = { version = "2", optional = true }

[dev-dependencies]
assert_matches = "1.5.0"
pretty_assertions = "1.4.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
